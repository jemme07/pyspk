[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspk"
version = "2.0.1"
description = "Python package to predict the suppression of the total matter power spectrum due to baryonic physics"
readme = "README.md"
requires-python = ">=3.9"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [
  { name = "Jaime Salcido", email = "j.salcidonegrete@ljmu.ac.uk" },
]
keywords = ["cosmology", "matter power spectrum", "baryons", "astrophysics"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.22",
  "pydantic>=2",
  "scipy>=1.8",
  "typing-extensions>=4.8",
]

[project.urls]
Homepage = "https://github.com/jemme07/pyspk"
Repository = "https://github.com/jemme07/pyspk"
Issues = "https://github.com/jemme07/pyspk/issues"

[project.optional-dependencies]
cosmology = [
  "astropy>=5",
]
examples = [
  "astropy>=5",
  "corner>=2.2",
  "cycler>=0.12",
  "emcee>=3",
  "jupyter>=1.0",
  "matplotlib>=3.7",
  "pandas>=2.0",
]
dev = [
  "pytest>=8",
  "pyright>=1.1.380",
  "ruff>=0.6",
  "black>=24",
  "mypy>=1.8",
  "setuptools>=69",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyspk*"]

[tool.setuptools.package-data]
pyspk = ["stat_errors_*.csv", "py.typed"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "W",
  "UP",
  "B",
  "SIM",
  "NPY",
  "D",
]
ignore = [
  "D203",
  "D213",
  "UP007",
  "UP045",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
ignore_missing_imports = true
